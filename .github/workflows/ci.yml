name: CI

# Roda em toda branch (inclusive claude/* e audit/*) e em todo pull request:
# a main publica direto em produção, então o CI tem que passar ANTES do merge.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint & Typecheck
    # Versão fixa do runner: o ubuntu-latest troca de imagem sem aviso.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
